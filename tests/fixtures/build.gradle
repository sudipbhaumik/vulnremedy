// Sample build.gradle (Groovy DSL) for parser testing.
//
// Deliberately includes:
//   - String notation with single quotes:  implementation 'group:artifact:version'
//   - String notation with double quotes:  implementation "group:artifact:version"
//   - Parenthesised Groovy notation:       implementation('group:artifact:version')
//   - Map notation:                        implementation group: '...', name: '...', version: '...'
//   - Platform/BOM import:                 implementation platform('group:artifact:version')
//   - String interpolation:                implementation "group:artifact:${springBootVersion}"
//   - Missing version (BOM-managed):       implementation 'group:artifact'
//   - Multiple configurations:             testImplementation, runtimeOnly, compileOnly, api
//   - Log4Shell:   log4j-core 2.14.1   → CVE-2021-44228
//   - Spring4Shell: spring-webmvc 5.3.17 → CVE-2022-22965
//   - Text4Shell:  commons-text 1.9    → CVE-2022-42889

plugins {
    id 'java'
    id 'org.springframework.boot' version '2.6.6'
}

ext {
    springBootVersion = '2.6.6'
    log4jVersion = '2.14.1'
}

dependencies {

    // CVE-2021-44228: Log4Shell — version from ext property interpolation
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    // CVE-2022-22965: Spring4Shell — single-quote string notation
    implementation 'org.springframework:spring-webmvc:5.3.17'

    // CVE-2022-42889: Text4Shell — double-quote string notation
    implementation "org.apache.commons:commons-text:1.9"

    // Spring Boot BOM — platform import (no direct CVE, but exercises platform path)
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    // BOM-managed dependency — no explicit version
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Map notation — Groovy-only syntax
    implementation group: 'com.google.guava', name: 'guava', version: '30.1-jre'

    // Parenthesised Groovy notation (also valid Groovy)
    implementation('com.fasterxml.jackson.core:jackson-databind:2.13.2')

    // api configuration — exposes transitive dependency to consumers
    api 'org.slf4j:slf4j-api:1.7.36'

    // compileOnly — present at compile time, not at runtime
    compileOnly 'org.projectlombok:lombok:1.18.24'

    // runtimeOnly — H2 in-memory DB for dev
    runtimeOnly 'com.h2database:h2:2.1.210'

    // testImplementation
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'

    // annotationProcessor
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
}
