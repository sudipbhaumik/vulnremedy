[project]
name = "vulnremedy"
version = "0.1.0"
description = "AI-powered vulnerability remediation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LangChain + LangGraph — agent orchestration
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",

    # Vector store
    "chromadb>=0.5.0",

    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Data validation — Pydantic v2
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # HTTP client
    "httpx>=0.27.0",

    # Data processing
    "pandas>=2.2.0",

    # Guardrails
    "guardrails-ai>=0.5.0",

    # MLflow
    "mlflow>=2.17.0",

    # Observability
    "structlog>=24.4.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",       # Retry logic
    "rich>=13.9.0",          # Pretty terminal output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",           # Linting + formatting
    "mypy>=1.13.0",          # Type checking
    "httpx>=0.27.0",         # Test HTTP client
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnremedy"] 

# Ruff — replaces flake8, black, isort in one tool
[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

# Mypy — strict type checking
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true