version: "3.9"

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: vulnremedy-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/vector_store:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: vulnremedy-mlflow
    ports:
      - "5001:5000"
    volumes:
      - ./mlflow_artifacts:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: vulnremedy-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vulnremedy
      POSTGRES_USER: vulnremedy
      POSTGRES_PASSWORD: vulnremedy_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnremedy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: